<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Asteroids With Ship PowerUps</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { display: block; margin: 0 auto; background: black; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<script>
// ---== CANVAS SETUP ==---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
console.log("RUNNING FILE:", window.location.href);
// ---== CONSTANTS & HELPERS ==---
const TWO_PI = Math.PI * 2;

// ---== AUDIO ASSETS ==---
const SFX = {
  laser:    new Audio('sounds/laser4.ogg'),
  torpedo:  new Audio('sounds/laser5.ogg'),
  expBig:   new Audio('sounds/explosion1.ogg'),
  expMed:   new Audio('sounds/explosion2.ogg'),
  expSml:   new Audio('sounds/explosion3.ogg'),
  bigBoom:  new Audio('sounds/explosion6.ogg'),
  boost:    new Audio('sounds/boost.ogg'),
  warp:     new Audio('sounds/warpout.ogg'),
  flip:     new Audio('sounds/flip.ogg'),
  extraLife: new Audio('sounds/extraLife.mp3'),
  splashScreen: new Audio('sounds/SplashScreen.mp3')
};

SFX.splashScreen.loop = true;
SFX.splashScreen.volume = 0.30;

// Helper function to play sounds so they can overlap
function play(audio, vol = 0.5) {
  const n = audio.cloneNode();
  n.volume = vol;
  n.play();
}

function asteroidColor(radius) {
  const shade = Math.floor(120 + (radius / 60) * 80);
  return `rgb(${shade}, ${shade - 40}, ${shade - 80})`;
}

function circleCollide(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  const dist = Math.hypot(dx, dy);
  return dist < a.radius + b.radius;
}
/* ===========================
      SECTION: STARFIELD
   =========================== */
let stars = [];

function initStarfield() {
  const numStars = 200;

  for (let i = 0; i < numStars; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      z: Math.random() * 3 + 1,
      size: Math.random() * 2 + 1,
      twinkle: Math.random() * 0.05 + 0.02
    });
  }
}

function updateStarfield() {
  const speed = ship.boosting ? 2 : 0.5;

  for (let s of stars) {
    s.y += speed * s.z;

    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }

    s.size += Math.sin(Date.now() * s.twinkle) * 0.02;
  }
}

function drawStarfield() {
  for (let s of stars) {
    const brightness = 150 + s.z * 50;
    ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;

    const shakeX = shakeTime > 0 ? (Math.random() - 0.5) * 2 : 0;
    const shakeY = shakeTime > 0 ? (Math.random() - 0.5) * 2 : 0;

    ctx.fillRect(s.x + shakeX, s.y + shakeY, s.size, s.size);
  }

  if (ship.boosting) {
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;

    for (let s of stars) {
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x, s.y - 10 * s.z);
      ctx.stroke();
    }
  }
}

// =--== INPUT HANDLING ==---
const Controls = {
  left: 37,     // Left arrow
  right: 39,    // Right arrow
  thrust: 86,   // V
  flip: 82,     // R
  fire: 70,     // F
  torpedo: 66   // B
};

const keys = {};

window.addEventListener("keydown", e => {

  // Block macOS Command shortcuts (⌘)
  if (e.metaKey) {
    e.preventDefault();
    return;
  }

  const controlKeys = [
    Controls.left,
    Controls.right,
    Controls.thrust,
    Controls.flip,
    Controls.fire,
    Controls.torpedo
  ];

  if (controlKeys.includes(e.keyCode)) {
    e.preventDefault();
  }

  // Record key press
  keys[e.keyCode] = true;

  // Restart game (Enter)
  if (gameOver && e.key === "Enter") {
    restartGame();
    return;
  }

  // Start game from splash screen
  if (showSplash) {
    if (e.key === "Enter") {
      SFX.splashScreen.pause();
      SFX.splashScreen.currentTime = 0;
      showSplash = false;
      paused = false;
    }
    return;
  }

  // Pause toggle (P or p)
  if (e.key.toLowerCase() === "p") {
    paused = !paused;
    return;
  }

  if (paused) return;

  if (e.keyCode === Controls.torpedo && !torpedo && torpedoCooldown === 0) {
    torpedo = new Torpedo(ship.x, ship.y, ship.angle);
    play(SFX.torpedo, 0.8);
    torpedoCooldown = torpedoCooldownMax;
  }

  // Instant 180° Flip (O key)
  if (e.keyCode === Controls.flip) {
    ship.angle += Math.PI;
    play(SFX.flip, 0.3);
  }

  if (e.keyCode === Controls.fire && !gameOver && !e.repeat) {
    ship.shoot();
  }
});

window.addEventListener("keyup", e => {
  keys[e.keyCode] = false;
});
/* ===========================
      SECTION: SHIP CLASS
   =========================== */
class Ship {
  constructor() {
    this.x = canvas.width / 2;
    this.y = canvas.height / 2;
    this.radius = 15;
    this.angle = 0;
    this.velX = 0;
    this.velY = 0;
    this.thrust = 0.09;
    this.friction = 0.97;
    this.canShoot = true;
    this.reloadTime = 110;
    this.fireCooldown = 0;
    this.fireRate = 10; // frames between shots
    this.invincible = 0;
    this.boosting = false;
  }

  update() {
    if (this.fireCooldown > 0) {
        this.fireCooldown--;
    }

    // Continuous fire
    if (keys[Controls.fire] && this.fireCooldown === 0 && !gameOver) {
      this.shoot();
      this.fireCooldown = this.fireRate;
    }

    // Turning
    if (keys[Controls.left])  this.angle -= 0.1;
    if (keys[Controls.right]) this.angle += 0.1;

    this.boosting = keys[Controls.thrust];

    // Thrust (K key)
    if (this.boosting) {
      this.velX += Math.cos(this.angle) * this.thrust;
      this.velY += Math.sin(this.angle) * this.thrust;
    }

    // Apply friction
    this.velX *= this.friction;
    this.velY *= this.friction;

    // Move ship
    this.x += this.velX;
    this.y += this.velY;

    // Screen wrap
    if (this.x < 0) this.x = canvas.width;
    if (this.x > canvas.width) this.x = 0;
    if (this.y < 0) this.y = canvas.height;
    if (this.y > canvas.height) this.y = 0;

    // Invincibility countdown
    if (this.invincible > 0) {
      this.invincible--;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    const flicker = this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 0;

    if (!flicker) {
      ctx.fillStyle = "white";
      ctx.strokeStyle = "white";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(-15, -12);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-15, 12);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      if (keys[Controls.thrust]) {
        ctx.beginPath();
        ctx.moveTo(-15, -6);
        ctx.lineTo(-25, 0);
        ctx.lineTo(-15, 6);
        ctx.strokeStyle = "orange";
        ctx.stroke();
      }
    }

    if (shieldHp > 0) {
      const shieldStrength = shieldHp / shieldMaxHp;
      const breath = Math.sin(shieldBreath) * 2.5;
      const shieldRadius = this.radius + 11 + breath + shieldHitPulse * 0.2;


      ctx.strokeStyle = shieldStrength < 0.35 ? "rgba(130, 220, 255, 0.65)" : "rgba(140, 230, 255, 0.95)";
      ctx.lineWidth = 3 + shieldHitPulse * 0.08;
      ctx.shadowColor = "rgba(130, 220, 255, 0.95)";
      ctx.shadowBlur = 18 + shieldHitPulse;
      ctx.beginPath();
      ctx.arc(0, 0, shieldRadius, 0, TWO_PI);
      ctx.stroke();

      ctx.shadowBlur = 0;

      if (shieldStrength < 0.55) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-8, -shieldRadius + 8);
        ctx.lineTo(-2, -3);
        ctx.lineTo(4, 6);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(shieldRadius - 10, -4);
        ctx.lineTo(5, 2);
        ctx.lineTo(0, 10);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  fireAngle(angle) {
    const speed = 15;
    bullets.push(new Bullet(
      this.x + Math.cos(angle) * this.radius,
      this.y + Math.sin(angle) * this.radius,
      Math.cos(angle) * speed + this.velX,
      Math.sin(angle) * speed + this.velY
    ));
  }

  shoot() {
    if (!this.canShoot) return;
    this.canShoot = false;
    setTimeout(() => this.canShoot = true, this.reloadTime);

    play(SFX.laser, 0.2);

    // --- POWERUP FIRING MODES ---
    if (activePowerup === "spread") {
      this.fireAngle(this.angle - 0.15);
      this.fireAngle(this.angle);
      this.fireAngle(this.angle + 0.15);
      return;
    }

    if (activePowerup === "double") {
      const spread = [-0.25, -0.15, 0, 0.15, 0.25];
      spread.forEach(a => this.fireAngle(this.angle + a));
      return;
    }

    if (activePowerup === "pierce") {
      const b = new Bullet(
        this.x + Math.cos(this.angle) * this.radius,
        this.y + Math.sin(this.angle) * this.radius,
        Math.cos(this.angle) * 15 + this.velX,
        Math.sin(this.angle) * 15 + this.velY
      );
      b.pierce = 3;
      bullets.push(b);
      return;
    }

    if (activePowerup === "ricochet") {
      const b = new Bullet(
        this.x + Math.cos(this.angle) * this.radius,
        this.y + Math.sin(this.angle) * this.radius,
        Math.cos(this.angle) * 15 + this.velX,
        Math.sin(this.angle) * 15 + this.velY
      );
      b.bounced = false;
      bullets.push(b);
      return;
    }

    // --- NORMAL SHOT ---
    this.fireAngle(this.angle);
  }
}
/* ===========================
      SECTION: POWERUPS
   =========================== */

class Powerup {
  constructor(type) {
    this.type = type;

    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;

    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    
    this.radius = 20;
    this.life = 600; // lasts 10 seconds on the map
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    this.life--;

    this.vx *= 0.99;
    this.vy *= 0.99;

    // Wrap around screen
    if (this.x < -this.radius) this.x = canvas.width + this.radius;
    if (this.x > canvas.width + this.radius) this.x = -this.radius;
    if (this.y < -this.radius) this.y = canvas.height + this.radius;
    if (this.y > canvas.height + this.radius) this.y = -this.radius;
  }

  draw() {
    const colors = {
      spread: "rgb(255, 170, 70)",
      double: "rgb(255, 90, 90)",
      pierce: "rgb(220, 120, 255)",
      ricochet: "rgb(255, 235, 90)",
      shield: "rgb(110, 210, 255)"
    };

    ctx.fillStyle = colors[this.type] || "rgb(180, 100, 30)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, TWO_PI);
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.font = "12px Courier New";
    ctx.textAlign = "center";
    ctx.fillText(this.type[0].toUpperCase(), this.x, this.y + 4);
  }
}

window.Powerup = Powerup;

// ---== BULLET ==---
class Bullet {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.radius = 3;
    this.pierce = 3; // can hit 3 asteroids
    this.life = 30;
    this.bounced = false;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;

    // Wrap horizontally
    if (this.x < -this.radius) {
      this.x = canvas.width + this.radius;
    } else if (this.x > canvas.width + this.radius) {
      this.x = -this.radius;
    }

    // Wrap vertically
    if (this.y < -this.radius) {
      this.y = canvas.height + this.radius;
    } else if (this.y > canvas.height + this.radius) {
      this.y = -this.radius;
    }
  }

  draw() {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, TWO_PI);
    ctx.fill();
  }
}
/* ===========================
      SECTION: TORPEDO SYSTEM
   =========================== */
class Torpedo {
  constructor(x, y, angle) {
    this.x = x;
    this.y = y;
    this.angle = angle;
    this.speed = 8;
    this.life = 120;
  }

  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.life--;

    // --- PLASMA TRAIL ---
    for (let i = 0; i < 2; i++) {
      const angle = this.angle + Math.PI + (Math.random() * 0.4 - 0.2);
      const speed = Math.random() * 1.2 + 0.4;
      const life = Math.random() * 18 + 12;

      particles.push(new Particle(
        this.x - Math.cos(this.angle) * 8,
        this.y - Math.sin(this.angle) * 8,
        angle,
        speed,
        life,
        "rgba(120,255,120,0.9)"
      ));
    }

    // --- SCREEN WRAP ---
    if (this.x < 0) this.x += canvas.width;
    if (this.x > canvas.width) this.x -= canvas.width;
    if (this.y < 0) this.y += canvas.height;
    if (this.y > canvas.height) this.y -= canvas.height;
}


  draw() {
    ctx.save();
    ctx.strokeStyle = "lime";
    ctx.lineWidth = 3;
    ctx.shadowColor = "rgba(140, 255, 140, 0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(
      this.x - Math.cos(this.angle) * 10,
      this.y - Math.sin(this.angle) * 10
    );
    ctx.fillStyle = "rgba(180,255,180,0.8)";
    ctx.beginPath();
    ctx.arc(this.x, this.y, 4, 0, TWO_PI);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

// ---== ASTEROID ==---
class Asteroid {
  constructor(x, y, radius) {
    this.x = x;
    this.y = y;
    this.radius = radius;
    const angle = Math.random() * TWO_PI;
    const speed = 1 + Math.random() * 1.1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.vertices = [];
    const verts = 10 + Math.floor(Math.random() * 5);
    for (let i = 0; i < verts; i++) {
      this.vertices.push((Math.random() * 0.4 + 0.8) * this.radius);
    }
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;

    // Wrap horizontally
    if (this.x < -this.radius) {
      this.x = canvas.width + this.radius;
    } else if (this.x > canvas.width + this.radius) {
      this.x = -this.radius;
    }

    // Wrap vertically
    if (this.y < -this.radius) {
      this.y = canvas.height + this.radius;
    } else if (this.y > canvas.height + this.radius) {
      this.y = -this.radius;
    }
  }

  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);

    const color = asteroidColor(this.radius);
    ctx.fillStyle = color;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    ctx.beginPath();
    const step = TWO_PI / this.vertices.length;
    for (let i = 0; i < this.vertices.length; i++) {
      const r = this.vertices[i];
      const angle = i * step;
      const px = Math.cos(angle) * r;
      const py = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }
}

// ---== PARTICLE ==---
class Particle {
  constructor(x, y, angle, speed, life, color) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = life;
    this.color = color;
    this.radius = 2;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.radius *= 0.96;
    this.color = this.color.replace(/0\.9|1\)/, `${this.life / 30})`);
  }

  draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, TWO_PI);
    ctx.fill();
  }
}

// ==---== GAME STATE ==---==
const ship = new Ship();
let showSplash = true;
let bullets = [];
let asteroids = [];
let particles = [];
let score = 0;
let highScore = localStorage.getItem("asteroidHighScore") || 0;
let level = 1;
let lives = 3;
let gameOver = false;
let paused = false;
let shakeTime = 0;
let powerupSpawnCooldown = 0;
let powerups = [];
let activePowerup = null;
let powerupTimer = 0;
let torpedo = null;
let torpedoCooldown = 0;
let torpedoCooldownMax = 240; 
let shieldHp = 0;
let shieldMaxHp = 0;
let shieldHitPulse = 0;
let shieldBreath = 0;
let flashTime = 0;
let flashMaxTime = 0;
let flashColor = "255,255,255";
let lifeCounterPulse = 0;
let lifeCounterX = 20; 
let lifeCounterY = 20;

// ==---== CORE GAME FUNCTIONS ==---==
function drawSplashScreen() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";

  // --- METALLIC BLUE GRADIENT ---
  const titleGradient = ctx.createLinearGradient(0, 0, 0, 80);
  titleGradient.addColorStop(0,   "#d6eaff");  // brighter top shine
  titleGradient.addColorStop(0.5, "#6fbaff");  // lighter mid metal
  titleGradient.addColorStop(1,   "#1d4e89");  // brighter steel blue bottom

  //ctx.textAlign = "center";

  // --- MAIN TITLE ---
  ctx.font = "bold 72px Courier New";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.fillStyle = titleGradient;

  // Neon red glow
  ctx.shadowColor = "rgba(255, 60, 60, 1)";
  ctx.shadowBlur = 15;

  // Draw stroke FIRST (outline)
  ctx.strokeText("ASTEROIDS", canvas.width / 2, canvas.height / 2 - 120);

  // Draw fill SECOND (metallic gradient)
  ctx.fillText("ASTEROIDS", canvas.width / 2, canvas.height / 2 - 120);

  // --- SUBTITLE ---
  ctx.font = "bold 30px Courier New";
  ctx.fillStyle = titleGradient;
  ctx.fillText("Now With Ship PowerUps", canvas.width / 2, canvas.height / 2 - 80);

  ctx.shadowBlur = 0;
  ctx.fillStyle = "gray";
  ctx.font = "bold 24px Courier New"; 
  ctx.fillText("Your Action Keys", canvas.width / 2, canvas.height / 2 - 45); 
  // Reset glow so other text doesn't glow
 
  ctx.font = "24px Courier New"; 
  ctx.textAlign = "left";
  const leftX = canvas.width / 2 - 100;  // adjust this number to taste
  ctx.fillText("Left   -  TURN", leftX, canvas.height / 2 - 10);
  ctx.fillText("Right  -  TURN", leftX, canvas.height / 2 + 20);
  ctx.fillText("V      -  THRUST", leftX, canvas.height / 2 + 50);
  ctx.fillText("R      -  180 FLIP", leftX, canvas.height / 2 + 80);
  ctx.fillText("F      -  FIRE", leftX, canvas.height / 2 + 110);
  ctx.fillText("B      -  TORPEDO", leftX, canvas.height / 2 + 140);
  ctx.fillText("P      -  PAUSE", leftX, canvas.height / 2 + 170);
  ctx.textAlign = "center";
  ctx.font = "bold 24px Courier New";
  ctx.fillText("PRESS ENTER TO START", canvas.width / 2, canvas.height / 2 + 220);
}
function spawnAsteroids(count) {
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * canvas.width;
      y = Math.random() * canvas.height;
    } while (Math.hypot(x - ship.x, y - ship.y) < 150);

    asteroids.push(new Asteroid(x, y, 40 + Math.random() * 20));
  }
}

function splitAsteroid(ast, index) {

  shakeTime = 5; 
  if (ast.radius > 30) {
    play(SFX.expBig, 0.6);
  } else if (ast.radius > 15) {
    play(SFX.expMed, 0.4);
  } else {
    play(SFX.expSml, 0.3);
  }

  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 1 + 2;
    const life = Math.random() * 30 + 20;
    const color = asteroidColor(ast.radius);
    particles.push(new Particle(ast.x, ast.y, angle, speed, life, color));
  }

  if (ast.radius < 20) {
    asteroids.splice(index, 1);
    return;
  }
  
  const newRadius = ast.radius / 2;
  asteroids.splice(index, 1);
  asteroids.push(new Asteroid(ast.x, ast.y, newRadius));
  asteroids.push(new Asteroid(ast.x, ast.y, newRadius));
}

function spawnLifeParticles(x, y) {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 2 + 0.5;
    const life = Math.random() * 20 + 20;
    const color = "yellow";

    particles.push(new Particle(x, y, angle, speed, life, color));
  }
}

function triggerFlash(color, frames) {
  flashColor = color;
  flashTime = frames;
  flashMaxTime = frames;
}

function activatePowerup(type) {
  activePowerup = type;

  if (type === "shield") {
    shieldMaxHp = 100;
    shieldHp = shieldMaxHp;
    shieldHitPulse = 12;
    triggerFlash("120,200,255", 8);
    return; // DO NOT TOUCH activePowerup
  }

  activePowerup = type; // only for weapon powerups
  powerupTimer = 900;
}
/* ===========================
      SECTION: SHIELD SYSTEM
   =========================== */

function spawnShieldSparks(x, y, count = 14) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 3 + 1.5;
    const life = Math.random() * 25 + 20;
    const color = Math.random() > 0.5 ? "#9fe7ff" : "white";
    particles.push(new Particle(x, y, angle, speed, life, color));
  }
}

function breakShield() {
  shieldHp = 0;
  shieldMaxHp = 0;
  shieldHitPulse = 18;
  shakeTime = Math.max(shakeTime, 18);
  triggerFlash("180,230,255", 12);
  play(SFX.expMed, 0.6);
  spawnShieldSparks(ship.x, ship.y, 34);
}

function damageShield(amount, x, y) {
  shieldHp = Math.max(0, shieldHp - amount);
  shieldHitPulse = 14;
  score += 20;
  triggerFlash("110,190,255", 5);
  spawnShieldSparks(x, y);

  if (shieldHp <= 0) {
    breakShield();
  }
}

function fizzleTorpedo(x, y) {
  triggerFlash("140,255,140", 4);
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 2 + 0.5;
    const life = Math.random() * 18 + 10;
    particles.push(new Particle(x, y, angle, speed, life, "lime"));
  }
}

function destroyAsteroidCompletely(index, points) {
  const ast = asteroids[index];
  if (!ast) return;

  score += points;

  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 4 + 1.5;
    const life = Math.random() * 30 + 20;
    particles.push(new Particle(ast.x, ast.y, angle, speed, life, asteroidColor(ast.radius)));
  }

  asteroids.splice(index, 1);
}

function detonateTorpedo(x, y) {
  shakeTime = 40;
  play(SFX.bigBoom, 1.0);
  triggerFlash("170,255,170", 14);

  const blastRadius = 3 * 40;

  for (let i = asteroids.length - 1; i >= 0; i--) {
    const dx = asteroids[i].x - x;
    const dy = asteroids[i].y - y;
    if (dx * dx + dy * dy < blastRadius * blastRadius) {
      destroyAsteroidCompletely(i, 100);
    }
  }

  for (let i = 0; i < 80; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 5 + 2;
    const life = Math.random() * 60 + 40;
    particles.push(new Particle(x, y, angle, speed, life, "lime"));
  }
}

function killShip() {
  if (shieldHp > 0) return;

  lives--;
  shakeTime = 60;
  play(SFX.expBig, 0.9);

  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * TWO_PI;
    const speed = Math.random() * 4 + 1;
    const life = Math.random() * 50 + 30;
    // Use white/orange particles to match the ship/thrust colors
    const color = Math.random() > 0.5 ? "white" : "orange";
    particles.push(new Particle(ship.x, ship.y, angle, speed, life, color));
  }

  if (lives <= 0) {
    gameOver = true;
    return;
  }

  // respawn ship safely
  ship.x = canvas.width / 2;
  ship.y = canvas.height / 2;
  ship.velX = 0;
  ship.velY = 0;
  play(SFX.warp, 0.5);
  // small invincibility window incase an astriod is real close
  ship.invincible = 180; 
}

function restartGame() {
  score = 0;
  level = 1;
  lives = 3;
  gameOver = false;
  bullets = [];
  asteroids = [];
  particles = [];
  ship.x = canvas.width / 2;
  ship.y = canvas.height / 2;
  ship.velX = 0;
  ship.velY = 0;
  ship.invincible = 0;
  activePowerup = null;
  powerupTimer = 0;
  torpedo = null;
  shieldHp = 0;
  shieldMaxHp = 0;
  shieldHitPulse = 0;
  flashTime = 0;
  flashMaxTime = 0;
  powerups = [];
  powerupSpawnCooldown = 0;
  showSplash = true;
  SFX.boost.pause();
  SFX.boost.currentTime = 0;
  //SFX.splashScreen.currentTime = 0;
  //SFX.splashScreen.play().catch(() => {});
  spawnAsteroids(3);
}
/* ===========================
      SECTION: MAIN UPDATE LOOP
   =========================== */
function update() {
  if (showSplash) {
    if (SFX.splashScreen.paused) {
      SFX.splashScreen.play().catch(() => {});
    }
    return; // Keep the splash screen static until the player starts
  }

  if (gameOver || paused) {
    // allow screen effects to settle
    if (shakeTime > 0) shakeTime--;
    if (flashTime > 0) flashTime--;
    if (gameOver) torpedo = null;
    SFX.boost.pause();
    return;
  }

  if (torpedoCooldown > 0) torpedoCooldown--;
  if (flashTime > 0) flashTime--;
  if (shieldHitPulse > 0) shieldHitPulse--;
  shieldBreath += 0.05;

  updateStarfield();

  if (powerupSpawnCooldown > 0) {
    powerupSpawnCooldown--;
  } else {
    if (Math.random() < 0.002) {
      const types = ["ricochet", "spread", "pierce", "double", "shield"];
      const pick = types[Math.floor(Math.random() * types.length)];
      powerups.push(new Powerup(pick));
      powerupSpawnCooldown = 300; // 5 seconds at 60fps
    }
  }

  // ---== ENGINE BOOST SOUND ==---
  if (keys[Controls.thrust]) {
    if (SFX.boost.paused) {
        SFX.boost.loop = true;
        SFX.boost.volume = 0.75;
        SFX.boost.play();
    }
  } else {
      SFX.boost.pause();
      SFX.boost.currentTime = 0;
  }

  if (powerupTimer > 0) {
    powerupTimer--;
    if (powerupTimer === 0) activePowerup = null;
  }

  ship.update();

  bullets.forEach(b => b.update());
  asteroids.forEach(a => a.update());
  particles.forEach(p => p.update());
  powerups.forEach(p => p.update());

  if (torpedo) {
    torpedo.update();
    if (torpedo.life <= 0) {
      fizzleTorpedo(torpedo.x, torpedo.y);
      torpedo = null;
    }
  }

  bullets = bullets.filter(b => b.life > 0);
  particles = particles.filter(p => p.life > 0);

  for (let i = asteroids.length - 1; i >= 0; i--) {
    if (torpedo) {
      const dx = asteroids[i].x - torpedo.x;
      const dy = asteroids[i].y - torpedo.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < asteroids[i].radius) {
        detonateTorpedo(torpedo.x, torpedo.y);
        torpedo = null;
        break;
      }
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (circleCollide(asteroids[i], bullets[j])) {
        const bullet = bullets[j];

        // --- PIERCE LOGIC ---
        if (activePowerup === "pierce") {
          if (bullet.pierce > 0) {
            bullet.pierce--;
          } else {
            bullets.splice(j, 1);
          }
        }

        // --- RICOCHET LOGIC ---
        else if (activePowerup === "ricochet") {
          if (!bullet.bounced) {
            let nearest = null;
            let nearestDist = Infinity;

            for (let k = 0; k < asteroids.length; k++) {
              if (k === i) continue;
              const dx = asteroids[k].x - bullet.x;
              const dy = asteroids[k].y - bullet.y;
              const dist = dx*dx + dy*dy;
              if (dist < nearestDist) {
                nearestDist = dist;
                nearest = asteroids[k];
              }
            }

            if (nearest) {
              const angle = Math.atan2(nearest.y - bullet.y, nearest.x - bullet.x);
              bullet.vx = Math.cos(angle) * 15;
              bullet.vy = Math.sin(angle) * 15;
              bullet.bounced = true;
              bullet.life = 20;
            } else {
              bullets.splice(j, 1);
            }
          } else {
            bullets.splice(j, 1);
          }
        }

        // --- NORMAL BULLET ---
        else {
          bullets.splice(j, 1);
        }

        score += 10;
        splitAsteroid(asteroids[i], i);
        break;
      }
    }
  }

  for (let a of asteroids) {
    for (let p of powerups) {
      if (circleCollide(a, p)) {
        const angle = Math.atan2(p.y - a.y, p.x - a.x);
        p.vx += Math.cos(angle) * 0.5;
        p.vy += Math.sin(angle) * 0.5;
      }
    }
  }

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];

    if (circleCollide(p, ship)) {
      activatePowerup(p.type);
      powerups.splice(i, 1);
      break;
    }

    if (p.life <= 0) powerups.splice(i, 1);
  }

  for (let i = asteroids.length - 1; i >= 0; i--) {
    if (!circleCollide(asteroids[i], ship) || ship.invincible > 0) continue;

    if (shieldHp > 0) {
      const damage = asteroids[i].radius > 30 ? 34 : (asteroids[i].radius > 15 ? 22 : 12);
      damageShield(damage, asteroids[i].x, asteroids[i].y);
      splitAsteroid(asteroids[i], i);
      continue;
    }

    killShip();
    break;
  }

  if (asteroids.length === 0 && !gameOver) {
    level++;

    if (level > 1 && (level - 1) % 2 === 0) {
      giveExtraLife();
    }
    spawnAsteroids(3 + level);
  }
}

/* ===========================
      SECTION: DRAW LOOP
   =========================== */

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (showSplash) {
    drawSplashScreen();
    return;
  }

  drawStarfield();

  ctx.save(); 
  if (shakeTime > 0) {
    const dx = Math.random() * 6 - 3;
    const dy = Math.random() * 6 - 3;
    ctx.translate(dx, dy);
    shakeTime--;
  }

  ship.draw();
  if (torpedo) torpedo.draw();
  bullets.forEach(b => b.draw());
  asteroids.forEach(a => a.draw());
  particles.forEach(p => p.draw());
  powerups.forEach(p => p.draw());
  ctx.restore();

  // ---== UI OVERLAY ==---
  ctx.textAlign = "left"; 
  ctx.fillStyle = "white";
  ctx.font = "16px Courier New";
  
  // Stats (Left Side)
  ctx.fillText(`SCORE: ${score}`, 20, 30);
  ctx.fillText(`HIGH:  ${highScore}`, 20, 55);
  ctx.fillText(`LIVES: ${lives}`, 20, 80);
  ctx.fillText(`LEVEL: ${level}`, 20, 105);

  // Controls Legend (Right Side)
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
  ctx.font = "16px Courier New";
  ctx.fillText("CONTROLS", canvas.width - 20, 30);

  ctx.font = "14px Courier New";
  ctx.fillText("[V] THRUST", canvas.width - 20, 55);
  ctx.fillText("[Left / Right] TURN", canvas.width - 20, 75);
  ctx.fillText("[R] 180 FLIP", canvas.width - 20, 95);
  ctx.fillText("[F] FIRE", canvas.width - 20, 115);
  ctx.fillText("[B] TORPEDO", canvas.width - 20, 135);
  ctx.fillText("[P] PAUSE", canvas.width - 20, 155);

  // Torpedo Cooldown Bar
  if (torpedoCooldown > 0) {
    const pct = 1 - (torpedoCooldown / torpedoCooldownMax);
    ctx.fillStyle = "lime";
    ctx.fillRect(canvas.width - 150, canvas.height - 30, 120 * pct, 8);
    ctx.strokeStyle = "white";
    ctx.strokeRect(canvas.width - 150, canvas.height - 30, 120, 8);
  } else {
    ctx.fillStyle = "lime";
    ctx.font = "14px Courier New";
    ctx.fillText("TORPEDO READY", canvas.width - 90, canvas.height - 35);
   }

  // Update High Score Logic
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("asteroidHighScore", highScore);
  }

  // ---== SCREENS (PAUSE / GAME OVER) ==---
  ctx.textAlign = "center";

  if (gameOver) {
    ctx.fillStyle = "red";
    ctx.font = "40px Courier New";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
    ctx.font = "20px Courier New";
    ctx.fillText("Press ENTER to restart", canvas.width / 2, canvas.height / 2 + 40);
  } else if (paused) {
    ctx.fillStyle = "yellow";
    ctx.font = "40px Courier New";
    ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
    
    ctx.fillStyle = "cyan";
    ctx.font = "20px 'Courier New', monospace";
    ctx.fillText("SYSTEMS READY - PRESS 'P' TO ENGAGE", canvas.width / 2, canvas.height / 2 + 50);
  }

  if (activePowerup) {
    ctx.fillStyle = "cyan";
    ctx.font = "18px Courier New";
    if (activePowerup === "shield") {
      ctx.fillText(`SHIELD: ${shieldHp}/${shieldMaxHp}`, canvas.width / 2, 40);
    } else {
      ctx.fillText(`POWER: ${activePowerup.toUpperCase()} (${Math.ceil(powerupTimer/60)})`,
                   canvas.width / 2, 40);
    }
  }

  if (flashTime > 0 && flashMaxTime > 0) {
    ctx.fillStyle = `rgba(${flashColor}, ${0.35 * (flashTime / flashMaxTime)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

}

function giveExtraLife() {
    lives++;
    play(SFX.extraLife, 0.5);
    spawnLifeParticles(lifeCounterX, lifeCounterY);
    lifeCounterPulse = 10;
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ==---== START GAME ==---==
initStarfield();
spawnAsteroids(3);
loop();

</script>
