<!DOCTYPE html>
<html>
<head>
  <title>To‑Do App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app-container">
  <h1>My To‑Do List</h1>

  <div id="task-stats">
    Total: <span id="total-count">0</span> |
    Done: <span id="done-count">0</span> |
    Not done: <span id="not-done-count">0</span>
  </div>
  
  <form id="task-form">
    <input id="task-input" type="text" placeholder="Type a task" />
    <button type="submit">Add</button>
  </form>

  <ul id="task-list"></ul>
</div>

  <script src="main.js" defer></script>
</body>

</html>
